</div>

</button>

</div>

</button>
<button class="pv-botao-redondo" onclick="pedirLimparConversa()" aria-label="Limpar conversa">

</button>
<span class="pv-espaco"></span>
<button class="pv-botao-redondo" onclick="mensagemVoz()" aria-label="Mensagem de voz">
<svg viewBox="0 0 24 24" fill="none"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z" stroke="var(--muted)" stroke-width="2"/><path d="M6 11a6 6 0 0 0 12 0M12 17v3" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/></svg>
</button>
<button id="btn-enviar-chat" class="pv-botao-redondo" onclick="enviar()" aria-label="Enviar">
<svg viewBox="0 0 24 24" fill="none"><path d="M12 19V5M6 11l6-6 6 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
</div>
</div>
</div>

<div id="sidebar-overlay" onclick="fecharSidebar()"></div>
<div id="sidebar">
<div id="sidebar-cabecalho">{{BOT_NOME}}</div>
<div id="sidebar-conteudo">
<button onclick="alternarTema()">
<span class="sidebar-icone"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3a9 9 0 1 0 9 9c0-.5-.03-1-.1-1.5a5.5 5.5 0 0 1-7.4-7.4C13 3.03 12.5 3 12 3z" stroke="#7A6A5E" stroke-width="2" stroke-linejoin="round"/></svg></span>
Tema
</button>
<button onclick="fecharSidebar();pedirLimparConversa()">
<span class="sidebar-icone"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3m-8 0v13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V7" stroke="#7A6A5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>

</button>

<div class="sobre-rotulo">Sobre este bot</div>

</div>
</div>

<a href="https://botql-edidor.vercel.app/" target="_blank" rel="noopener">Criar o meu bot</a>
</div>
</div>

<div id="modal-rodape"></div>
</div>
